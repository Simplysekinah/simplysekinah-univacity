<header class="p-4 sticky top-0 z-10 bg-white">
    <ion-header >
        <ion-toolbar>
            <ion-buttons slot="start">
                <ion-back-button defaultHref="/"></ion-back-button>
            </ion-buttons>

            <ion-title class="border-2 rounded-[20px] py-4">
                <ion-item lines="none">
                    <ion-label>
                        <p>What do you want to study?</p>
                        <h2>Computer Technologies</h2>
                    </ion-label>
                    <ion-icon name="chevron-down-outline"></ion-icon>
                </ion-item>
            </ion-title>
        </ion-toolbar>
        <div class="down">
            <ion-toolbar class="p-4">
                <ion-buttons class="flex gap-2" slot="start" (click)="openSortModal()">
                    <ion-icon class="size-5" name="funnel-outline"></ion-icon>
                    <ion-label class="text-[#454545] font-medium">Sort</ion-label>
                </ion-buttons>
    
                <ion-buttons class="flex gap-2" slot="end" (click)="openFilterModal()">
                    <ion-icon class="size-5" name="options-outline"></ion-icon>
                    <ion-label class="text-[#454545] font-medium">Filter</ion-label>
                    <ion-badge color="danger" class="filter-badge">3</ion-badge>
                </ion-buttons>
            </ion-toolbar>
        </div>
    </ion-header>
</header>
