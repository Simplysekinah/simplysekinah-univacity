<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="clear" (click)="close()">
        <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Institutes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  
  <div class="!p-4">
    <ion-item lines="none" class="chip-input">
      <ion-icon name="search-outline" slot="start"></ion-icon>
      <ion-input placeholder="Search institutes" inputmode="numeric"></ion-input>
    </ion-item>
  </div>

  <ion-list>
    <ion-item *ngFor="let inst of institutes" lines="none" [ngClass]="{'selected-item': selectedId === inst.id}"
      (click)="selectedId = inst.id" class="!py-3">

      <ion-avatar slot="start" class="!mr-3">
        <img [src]="inst.logo" alt="Logo" />
      </ion-avatar>

      <ion-label>
        <h2 class="font-medium text-sm">{{ inst.name }}
          <span class="count-pill">{{ inst.count }}</span>
        </h2>
        <div class="text-xs text-gray-500 flex items-center gap-1">
          <ion-icon name="flag-outline"></ion-icon>
          {{ inst.country }}
        </div>
      </ion-label>
      <input type="radio" class="size-5" [checked]="selectedId === inst.id">
      <!-- <ion-radio slot="end" [checked]="selectedId === inst.id"></ion-radio> -->
    </ion-item>
  </ion-list>
</ion-content>

<ion-footer>
  <div class="flex gap-3 !p-6 border-[#1e1e1e8a] border-t-2 rounded-t-2xl">
    <ion-button fill="outline" shape="round" expand="block" (click)="clearAll()">Clear all</ion-button>
    <ion-button shape="round" expand="block" class="grow" (click)="apply()">Apply Filter</ion-button>
  </div>
</ion-footer>
